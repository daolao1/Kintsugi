# One engine, four delivery vehicles.
#
# The point of this workflow is that Android, macOS, and Windows are built and
# *smoke-tested by running the binary*, from the same commit, every time. A
# platform that quietly stops building is a platform that quietly stops being
# maintained.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The gate: formatting, lints, unit tests, and the C ABI harness. If this
  # job is red, no artifact is worth shipping.
  verify:
    name: verify (fmt · clippy · test · C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # rodio links ALSA on Linux; the windowing crates want their headers
      # too. Installed once here so clippy, test, and the C ABI check all
      # see the same system the linux release job sees.
      - name: audio and windowing libraries the workspace links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      # v0.1.1 was published with binaries that answered `--version` with
      # "0.1.0", because the tag and the crate version are two numbers that had
      # never been introduced to each other. A user reporting a bug against the
      # wrong version is a cost paid by whoever reads the report.
      - name: the tag matches the version in the binary
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "workspace version: ${version}"
          grep -q "versionName = \"${version}\"" platforms/android/app/build.gradle.kts \
            || { echo "the APK's versionName is not ${version}"; exit 1; }
          case "${GITHUB_REF}" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              [ "${tag}" = "${version}" ] \
                || { echo "tag v${tag} does not match version ${version}"; exit 1; }
              echo "tag v${tag} matches the workspace version" ;;
            *) echo "not a tag; nothing to match" ;;
          esac

      - name: C ABI checked from C
        run: |
          set -euo pipefail
          cargo build -p kintsugi-android
          cc -Wall -Wextra -Werror crates/kintsugi-android/tests/c_abi.c \
             -o /tmp/c_abi -Ltarget/debug -lkintsugi_android
          LD_LIBRARY_PATH=target/debug /tmp/c_abi

      - name: JNI symbol names match the Kotlin declarations
        run: |
          set -euo pipefail
          cargo build -p kintsugi-android --features jni-bridge
          for symbol in version detect play demo upscale; do
            nm -D --defined-only target/debug/libkintsugi_android.so \
              | grep -q "Java_com_kintsugi_engine_EngineBridge_${symbol}$" \
              || { echo "missing JNI symbol: ${symbol}"; exit 1; }
          done
          echo "all five JNI symbols are exported"

  # macOS: both architectures, joined into one universal binary.
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: build both architectures
        run: |
          set -euo pipefail
          cargo build --release -p kintsugi --target aarch64-apple-darwin
          cargo build --release -p kintsugi --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/kintsugi \
            target/x86_64-apple-darwin/release/kintsugi \
            -output target/kintsugi-macos-universal
          lipo -info target/kintsugi-macos-universal

      - name: smoke test the built binary
        run: scripts/smoke.sh ./target/kintsugi-macos-universal

      - name: build the desktop shell, both architectures
        run: |
          set -euo pipefail
          cargo build --release -p kintsugi-desktop --target aarch64-apple-darwin
          cargo build --release -p kintsugi-desktop --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/kintsugi-desktop \
            target/x86_64-apple-darwin/release/kintsugi-desktop \
            -output target/kintsugi-desktop-macos-universal

      - name: smoke test the desktop shell
        run: scripts/smoke-desktop.sh ./target/kintsugi-desktop-macos-universal

      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/kintsugi-macos-universal dist/kintsugi
          cp target/kintsugi-desktop-macos-universal dist/kintsugi-desktop
          tar -czf kintsugi-macos-universal.tar.gz -C dist kintsugi kintsugi-desktop
          shasum -a 256 kintsugi-macos-universal.tar.gz | tee kintsugi-macos-universal.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kintsugi-macos-universal
          path: |
            kintsugi-macos-universal.tar.gz
            kintsugi-macos-universal.tar.gz.sha256

  # Windows: built on Windows, no cross-compilation guesswork.
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: build
        run: |
          cargo build --release -p kintsugi --target x86_64-pc-windows-msvc
          cargo build --release -p kintsugi-desktop --target x86_64-pc-windows-msvc

      - name: cargo test
        run: cargo test --workspace --all-features

      # The repair loop through the *shipped* binary on this platform — the
      # same `scripts/smoke.sh` the other two jobs run, so "it works on
      # Windows" and "it works on macOS" are the same sentence.
      - name: smoke test the built binary
        shell: bash
        run: scripts/smoke.sh target/x86_64-pc-windows-msvc/release/kintsugi.exe "$RUNNER_TEMP/kintsugi-smoke"

      - name: smoke test the desktop shell
        shell: bash
        run: scripts/smoke-desktop.sh target/x86_64-pc-windows-msvc/release/kintsugi-desktop.exe "$RUNNER_TEMP/kintsugi-desktop-smoke"

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/kintsugi.exe dist/
          cp target/x86_64-pc-windows-msvc/release/kintsugi-desktop.exe dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          7z a kintsugi-windows-x86_64.zip ./dist/* > /dev/null
          sha256sum kintsugi-windows-x86_64.zip | tee kintsugi-windows-x86_64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kintsugi-windows-x86_64
          path: |
            kintsugi-windows-x86_64.zip
            kintsugi-windows-x86_64.zip.sha256

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The windowing crates load what they can at runtime; the headers make
      # sure the build never depends on which dlopen path a runner image has.
      - name: windowing libraries the build links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev

      - name: build
        run: |
          cargo build --release -p kintsugi
          cargo build --release -p kintsugi-desktop

      - name: smoke test the built binary
        run: scripts/smoke.sh ./target/release/kintsugi

      - name: smoke test the desktop shell
        run: scripts/smoke-desktop.sh ./target/release/kintsugi-desktop

      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/kintsugi dist/
          cp target/release/kintsugi-desktop dist/
          tar -czf kintsugi-linux-x86_64.tar.gz -C dist kintsugi
          sha256sum kintsugi-linux-x86_64.tar.gz | tee kintsugi-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kintsugi-linux-x86_64
          path: |
            kintsugi-linux-x86_64.tar.gz
            kintsugi-linux-x86_64.tar.gz.sha256

  # Android: four ABIs in one APK. The APK is a shell; the engine inside it is
  # the same commit as the three binaries above.
  android:
    name: Android (APK · 4 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      # `tools` was removed from the SDK repository in 2025, and the action's
      # default package list still asks for it ("Failed to find package
      # 'tools'"). Name what AGP 8.7 actually needs instead of taking the
      # default, so the job does not depend on a package that no longer ships.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b
          add-to-path: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # Pinned, not inherited: AGP 8.7.3 supports Gradle 8.9–8.x and the
      # runner's default Gradle may be 9.x, which it does not.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: build the engine for every ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o platforms/android/app/src/main/jniLibs \
            build --release -p kintsugi-android --features jni-bridge
          find platforms/android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} +

      - name: assemble the APK
        run: gradle --no-daemon assembleDebug
        working-directory: platforms/android

      - name: check the APK actually carries all four ABIs
        run: |
          set -euo pipefail
          apk=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libkintsugi_android\.so'
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$apk" | grep -q "lib/${abi}/libkintsugi_android.so" \
              || { echo "APK is missing the ${abi} slice"; exit 1; }
          done
          echo "all four ABIs are in the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: kintsugi-android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

  # Tagged commits become a release with every platform attached.
  release:
    name: attach artifacts to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, macos, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            🏺 Repairing old games with gold. 以金缮之艺，续老游戏之命。

            Every artifact here is built from this commit. The macOS, Windows,
            and Linux archives are smoke-tested by *running* the whole repair
            loop on them — `demo`, then `translate --mock`, then `install
            --into`, then playing the repaired copy — and by checking that a
            mistyped command line still exits 2. The Windows job also runs the
            test suite, not just the compiler. The Android APK cannot be run on
            a CI runner, so that job
            unpacks it and proves all four ABI slices (arm64-v8a,
            armeabi-v7a, x86_64, x86) are inside instead — it is a **debug**
            build, signed with the Android debug key, and release signing is a
            documented next step rather than a hidden one. Whether the APK
            renders correctly on a physical device is not something this
            project has verified, and it will not claim otherwise.
